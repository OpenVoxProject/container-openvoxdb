---
:global:
  matrix_command: bash matrix.sh build
  matrix_requires_yq: true
  build_runner: '${{ matrix.runner }}'
  build_file: 'Containerfile.${{ matrix.os }}'
  image_tag: 'ci/openvoxdb:${{ matrix.db_version }}-${{ matrix.os }}-${{ matrix.platform }}'
  build_platforms: 'linux/${{ matrix.platform }}'
  build_args:
    - 'OPENVOX_RELEASE=${{ matrix.release }}'
    - 'OPENVOXDB_VERSION=${{ matrix.db_version }}'
    - 'JDK_VERSION=${{ matrix.jdk_version }}'
    - 'PQL_VERSION=${{ matrix.pql_version }}'
.github/renovate.jsonc:
  renovate_custom_managers:
    - customType: regex
      managerFilePatterns:
        - /(^|/)Containerfile\.(?:alpine|ubuntu)$/
        - /(^|/)build_versions\.yaml$/
      matchStrings:
        - >-
          #\s*renovate:\s*datasource=(?<datasource>custom\.voxpupuli-artifacts)\s+depName=(?<depName>openvoxdb)\s*\n\s*(?:ARG\s+OPENVOXDB_VERSION=|db_version:\s*")(?<currentValue>\d+\.\d+\.\d+)
      versioningTemplate: semver
  renovate_custom_datasources:
    voxpupuli-artifacts:
      defaultRegistryUrlTemplate: 'https://artifacts.voxpupuli.org/{{packageName}}/'
      format: html
  renovate_package_rules:
    - matchDatasources:
        - custom.voxpupuli-artifacts
      allowedVersions: '/^8\./'
      extractVersion: '^(?<version>\d+\.\d+\.\d+)/$'
.github/workflows/ci.yml:
  general_ci_scan_dir: ./openvoxdb
  build_job_name: 'Build ${{ matrix.os }} / ${{ matrix.platform }} CI container'
  # Every test runs whatever the others do, and the step fails at the end if
  # any of them failed, so one failure never hides another test's result.
  # The unit tests (for matrix.sh, build_sequence.sh and the publish step)
  # need no image, so they run once: on the ubuntu/amd64 leg, using the yq that
  # the runner image ships; the template offers no earlier hook. Each image
  # then checks that its build script stops at the first missing file (see
  # tests/prep_build_test.sh), and is smoke-tested with USE_OPENVOXSERVER=false
  # and on its default TLS path against the floating OpenVox Server release it
  # pairs with (see tests/smoke.sh).
  test_commands:
    - failed=0
    - >-
      if [ '${{ matrix.os }}-${{ matrix.platform }}' = ubuntu-amd64 ]; then
      bash tests/matrix_test.sh || failed=1;
      bash tests/build_sequence_test.sh || failed=1;
      bash tests/publish_manifest_test.sh || failed=1;
      fi
    - >-
      bash tests/prep_build_test.sh
      'ci/openvoxdb:${{ matrix.db_version }}-${{ matrix.os }}-${{ matrix.platform }}'
      || failed=1
    - >-
      bash tests/smoke.sh
      'ci/openvoxdb:${{ matrix.db_version }}-${{ matrix.os }}-${{ matrix.platform }}'
      '${{ matrix.db_version }}' '${{ matrix.pql_version }}'
      || failed=1
    - >-
      bash tests/smoke.sh
      'ci/openvoxdb:${{ matrix.db_version }}-${{ matrix.os }}-${{ matrix.platform }}'
      '${{ matrix.db_version }}' '${{ matrix.pql_version }}'
      'ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}'
      || failed=1
    - exit "${failed}"
.github/workflows/security_scanning.yml:
  scan_job_name: 'Scan ${{ matrix.os }} / ${{ matrix.platform }} container'
  sarif_category: 'grype-${{ matrix.os }}-${{ matrix.platform }}'
.github/workflows/build_container.yml:
  # The template always adds a tag trigger, so a v* tag push still builds the
  # per-commit images. It publishes no build-numbered or floating tags: those
  # come only from main, which the manifest steps check for.
  publish_tag_patterns:
    - 'v*'
  publish_build_job_name: 'Build OpenVoxDB ${{ matrix.db_version }} (${{ matrix.os }}/${{ matrix.platform }})'
  publish_build_arch: 'linux/${{ matrix.platform }}'
  publish_tags:
    - 'ghcr.io/openvoxproject/openvoxdb:${{ matrix.release }}-${{ github.sha }}-${{ matrix.os }}-${{ matrix.platform }}'
  publish_manifest_matrix_command: bash matrix.sh tag
  # Only main publishes build-numbered tags, so other refs skip the registry
  # lookup; the manifest step refuses to publish without a number.
  publish_setup_steps:
    - name: Determine build sequence numbers
      id: build-sequence
      commands:
        - set -euo pipefail
        - 'if [ "$GITHUB_REF" = refs/heads/main ]; then build_sequence=$(bash build_sequence.sh); else build_sequence="{}"; fi'
        - 'echo "build-sequence=$build_sequence" >> "$GITHUB_OUTPUT"'
  publish_setup_outputs:
    build-sequence: '${{ steps.build-sequence.outputs.build-sequence }}'
  # publish_manifest.sh checks the build number and publishes it; the manifest
  # job checks out the repository to run it. publish_manifest_checkout needs
  # voxpupuli/container_modulesync_configs#124.
  publish_manifest_checkout: true
  publish_manifest_steps:
    - name: Create build manifest
      if: "${{ github.ref == 'refs/heads/main' }}"
      commands:
        - >-
          bash publish_manifest.sh
          '${{ matrix.release }}' '${{ matrix.db_version }}'
          '${{ fromJSON(needs.setup-matrix.outputs.build-sequence)[matrix.db_version] }}'
          '${{ github.sha }}'
    - name: Update floating Ubuntu tag
      if: "github.ref == 'refs/heads/main'"
      commands:
        - >-
          docker buildx imagetools create
          -t ghcr.io/openvoxproject/openvoxdb:latest
          -t docker.io/voxpupuli/openvoxdb:latest
          ghcr.io/openvoxproject/openvoxdb:${{ matrix.release }}-${{ github.sha }}-ubuntu-arm64
          ghcr.io/openvoxproject/openvoxdb:${{ matrix.release }}-${{ github.sha }}-ubuntu-amd64
    - name: Update floating Alpine tag
      if: "github.ref == 'refs/heads/main'"
      commands:
        - >-
          docker buildx imagetools create
          -t ghcr.io/openvoxproject/openvoxdb:latest-alpine
          -t docker.io/voxpupuli/openvoxdb:latest-alpine
          ghcr.io/openvoxproject/openvoxdb:${{ matrix.release }}-${{ github.sha }}-alpine-arm64
          ghcr.io/openvoxproject/openvoxdb:${{ matrix.release }}-${{ github.sha }}-alpine-amd64
  dockerhub_repository: voxpupuli/openvoxdb
